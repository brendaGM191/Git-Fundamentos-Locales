<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Git: Fundamentos Locales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .boton {
            padding: 10px 20px;
            margin: 5px;
            background-color: #1e88e5;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }
        .boton:hover {
            background-color: #1565c0;
        }
        .seccion {
            display: none;
            margin-top: 20px;
        }
        hr {
            margin: 25px 0;
        }
        pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
        }
    </style>

    <script>
        function mostrar(id) {
            document.querySelectorAll(".seccion").forEach(s => s.style.display = "none");
            document.getElementById(id).style.display = "block";
        }
    </script>
</head>
<body>

    <h1>Git: Fundamentos Locales</h1>

    <!-- BOTONES -->
    <button class="boton" onclick="mostrar('infografia')">Ver Infografía</button>
    <button class="boton" onclick="mostrar('pdf')">Ver PDF</button>
    <button class="boton" onclick="mostrar('video')">Ver Video</button>
    <button class="boton" onclick="mostrar('presentacion')">Ver Presentación</button>
    <button class="boton" onclick="mostrar('integrantes')">Ver Integrantes</button>

    <hr>

    <!-- SECCIONES OCULTAS -->

    <div id="infografia" class="seccion">
        <h2>Infografía</h2>
        <img src="infografia.jpg" width="400">
    </div>

    <div id="pdf" class="seccion">
        <h2>Guía Técnica (PDF)</h2>
        <a href="Guia_Tecnica.pdf" target="_blank">Abrir PDF</a>
    </div>

    <div id="video" class="seccion">
        <h2>Video</h2>
        <video width="600" controls>
            <source src="video.mp4" type="video/mp4">
            Tu navegador no soporta video.
        </video>
    </div>

    <div id="presentacion" class="seccion">
        <h2>Presentación</h2>
        <a href="presentacion.pptx" download>Descargar Presentación</a>
    </div>

    <div id="integrantes" class="seccion">
        <h2>Integrantes</h2>
        <ul>
            <li>Brenda</li>
            <li>Pamela</li>
            <li>Angela Jazmin</li>
            <li>Francisco Eduardo</li>
            <li>Jose Luis</li>
        </ul>
    </div>

</body>
</html>
